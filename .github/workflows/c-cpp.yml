name: Build Multiple .so Libraries

# 触发条件：push 代码 或 手动触发
on:
  push:
  workflow_dispatch:

jobs:
  build-so:
    runs-on: ubuntu-latest
    strategy:
      # 即使某个架构失败，也不影响其他架构继续编译
      fail-fast: false
      matrix:
        # 定义目标架构及其对应的交叉编译器和系统包
        config:
          - arch: x86_64
            cc: gcc
            cxx: g++
            packages: ''
            cmake_system_processor: x86_64
          - arch: arm64
            cc: aarch64-linux-gnu-gcc
            cxx: aarch64-linux-gnu-g++
            packages: g++-aarch64-linux-gnu
            cmake_system_processor: aarch64
          - arch: armv7
            cc: arm-linux-gnueabihf-gcc
            cxx: arm-linux-gnueabihf-g++
            packages: g++-arm-linux-gnueabihf
            cmake_system_processor: armv7l
          - arch: x86
            cc: i686-linux-gnu-gcc
            cxx: i686-linux-gnu-g++
            packages: g++-i686-linux-gnu
            cmake_system_processor: i686

    steps:
      # 1. 拉取你的 C++ 代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装对应架构的交叉编译工具链（x86_64 默认已安装，无需额外操作）
      - name: Install cross-compilation tools
        if: matrix.config.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.config.packages }}

      # 3. 配置 CMake（强制生成共享库）
      - name: Configure CMake
        run: |
          cmake -B build/${{ matrix.config.arch }} \
            -DCMAKE_C_COMPILER=${{ matrix.config.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.config.cxx }} \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.config.cmake_system_processor }} \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release

      # 4. 执行编译，生成 .so 文件
      - name: Build
        run: |
          cmake --build build/${{ matrix.config.arch }} --config Release -j $(nproc)

      # 5. 上传对应架构的 .so 产物到 GitHub Actions 的 Artifacts
      - name: Upload .so artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shared-libs-${{ matrix.config.arch }}
          # 这里假设你的 .so 文件直接生成在构建目录下
          # 如果你的项目有子目录，请修改路径，例如 build/x86_64/src/*.so
          path: build/${{ matrix.config.arch }}/*.so
          if-no-files-found: error
